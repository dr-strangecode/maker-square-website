services:
  web:
    build: .
    image: maker-square-website:dev
    container_name: maker-square-website
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      # Compose from ~/code/mspp/website so "." is that folder.
      # Override with HOST_WEBSITE_DIR if you start compose from elsewhere.
      - ${HOST_WEBSITE_DIR:-.}:/app
      - maker-square-node-modules:/app/node_modules
    working_dir: /app

volumes:
  maker-square-node-modules:
